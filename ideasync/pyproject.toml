[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ideasync"
version = "0.1.0"
description = "A single-writer bridge between an ideas vault and managed Git clones"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ideasync = "ideasync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ideasync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
